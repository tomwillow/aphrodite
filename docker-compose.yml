# Aphrodite 容器编排（Linux 部署用）
#
# 本文件由 scripts/config_compose.sh 交互式生成，也可以手工改：
# 重跑脚本时，会把这里的现有值当作默认值（回车即保留），所以手工改动不会白费。
#
# 前置条件：本地已有镜像（先跑 scripts/build_image.sh）。
# 启动：docker compose up -d     查看日志：docker compose logs -f

services:
  aphrodite:
    image: aphrodite:latest
    container_name: aphrodite
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APHRODITE_DATA: /data
      JAVBUS_BASE: "https://www.javbus.com"
      APHRODITE_PAGE_INTERVAL: "1.2"
      APHRODITE_IMAGE_INTERVAL: "0.15"
      APHRODITE_TASK_WORKERS: "2"
      APHRODITE_IMAGE_WORKERS: "5"
      APHRODITE_MAX_ATTEMPTS: "5"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
